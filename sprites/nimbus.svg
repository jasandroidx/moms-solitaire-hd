<!-- Nimbus — round fluffy cloud character, SNES-style sprite -->
<!-- 32x32px, minimal colors, chunky outlines like SNES resolution -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="nc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#b8d8f0"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <ellipse cx="16" cy="20" rx="12" ry="10" fill="url(#nc)" stroke="#5a8ab2" stroke-width="1.5"/>
  <!-- belly -->
  <ellipse cx="16" cy="22" rx="7" ry="5" fill="#d4eaf7"/>
  <!-- eyes -->
  <circle cx="12" cy="18" r="2.5" fill="#333"/>
  <circle cx="20" cy="18" r="2.5" fill="#333"/>
  <circle cx="13" cy="17.5" r="1" fill="#fff"/>
  <circle cx="21" cy="17.5" r="1" fill="#fff"/>
  <!-- sleepy half-closed eyes variant -->
  <g id="nimbus-sleepy">
    <path d="M10 18 Q12.5 17 15 18" fill="none" stroke="#333" stroke-width="1.2"/>
    <path d="M17 18 Q19.5 17 22 18" fill="none" stroke="#333" stroke-width="1.2"/>
  </g>
  <!-- happy smile -->
  <path d="M13 21 Q16 24 19 21" fill="none" stroke="#333" stroke-width="1" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="10" cy="21" r="1.5" fill="#f5c6c6" opacity="0.6"/>
  <circle cx="22" cy="21" r="1.5" fill="#f5c6c6" opacity="0.6"/>
  <!-- vacuum hose -->
  <g id="nimbus-hose">
    <rect x="24" y="16" width="8" height="3" rx="1.5" fill="#888" stroke="#555" stroke-width="0.5"/>
    <circle cx="32" cy="17.5" r="3" fill="#aaa" stroke="#555" stroke-width="0.5"/>
    <circle cx="32" cy="17.5" r="1.5" fill="#666"/>
  </g>
  <!-- tiny arms -->
  <line x1="6" y1="20" x2="3" y2="18" stroke="#5a8ab2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="20" x2="29" y2="18" stroke="#5a8ab2" stroke-width="1.5" stroke-linecap="round"/>
</svg>