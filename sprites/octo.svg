<!-- Octo — round purple octopus, SNES-style sprite -->
<!-- 32x32px, 8 tentacles each a different suit color -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="oc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a0e0"/>
      <stop offset="100%" stop-color="#9060b0"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <ellipse cx="16" cy="16" rx="11" ry="10" fill="url(#oc)" stroke="#5a3070" stroke-width="1.5"/>
  <!-- face -->
  <circle cx="12" cy="15" r="2" fill="#fff"/>
  <circle cx="20" cy="15" r="2" fill="#fff"/>
  <circle cx="12.5" cy="15" r="1" fill="#333"/>
  <circle cx="20.5" cy="15" r="1" fill="#333"/>
  <!-- mouth -->
  <path d="M14 19 Q16 21 18 19" fill="none" stroke="#4a2060" stroke-width="1" stroke-linecap="round"/>
  <!-- blush -->
  <circle cx="9" cy="18" r="1.5" fill="#f0a0c0" opacity="0.5"/>
  <circle cx="23" cy="18" r="1.5" fill="#f0a0c0" opacity="0.5"/>
  <!-- tentacles — each a different suit color -->
  <path d="M7 22 Q3 28 5 30" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/> <!-- hearts -->
  <path d="M9 23 Q6 29 8 31" fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round"/> <!-- spades -->
  <path d="M12 24 Q10 30 12 32" fill="none" stroke="#e8b64c" stroke-width="2.5" stroke-linecap="round"/> <!-- diamonds -->
  <path d="M15 24 Q15 30 15 32" fill="none" stroke="#2e7d4f" stroke-width="2.5" stroke-linecap="round"/> <!-- clubs -->
  <path d="M19 24 Q19 30 19 32" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/> <!-- hearts -->
  <path d="M22 23 Q24 29 22 31" fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round"/> <!-- spades -->
  <path d="M25 24 Q28 30 26 32" fill="none" stroke="#e8b64c" stroke-width="2.5" stroke-linecap="round"/> <!-- diamonds -->
  <path d="M25 22 Q29 28 27 30" fill="none" stroke="#2e7d4f" stroke-width="2.5" stroke-linecap="round"/> <!-- clubs -->
  <!-- suction cups on tentacles -->
  <circle cx="5" cy="29" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="8" cy="30" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="12" cy="31" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="15" cy="31" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="19" cy="31" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="22" cy="30" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="26" cy="31" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="27" cy="29" r="1" fill="#fff" opacity="0.4"/>
</svg>